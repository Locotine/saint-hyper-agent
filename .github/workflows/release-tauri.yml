name: Release Desktop (Tauri Rust)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.1.18 or v1.1.18)"
        required: true
        type: string
      publish_release:
        description: "Publish installers and latest.json to GitHub Releases"
        required: true
        default: false
        type: boolean
      platform:
        description: "Target platform scope"
        required: false
        type: choice
        default: all
        options: [all, win-x64, mac-arm64, mac-x64, linux-x64]

permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: saint-desktop-tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight & Rust Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      publish_release: ${{ steps.release_mode.outputs.publish_release }}
      matrix: ${{ steps.build_matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - id: release_mode
        name: Resolve publication mode
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
        run: |
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      # The matrix context is unavailable in a job-level `if`, so the platform
      # filter is applied here and the build job reads the filtered list.
      - id: build_matrix
        name: Resolve build platforms
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          ALL='[
            {"id":"win-x64","label":"Windows x64","runner":"windows-2022","platform":"win","arch":"x64","rust_target":"x86_64-pc-windows-msvc"},
            {"id":"mac-arm64","label":"macOS arm64","runner":"macos-15","platform":"mac","arch":"arm64","rust_target":"aarch64-apple-darwin"},
            {"id":"mac-x64","label":"macOS x64","runner":"macos-15","platform":"mac","arch":"x64","rust_target":"x86_64-apple-darwin"},
            {"id":"linux-x64","label":"Linux x64","runner":"ubuntu-24.04","platform":"linux","arch":"x64","rust_target":"x86_64-unknown-linux-gnu"}
          ]'
          INCLUDE="$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .id == $p))' <<<"$ALL")"
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Validate stable release version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          CLEAN_VERSION="$(node -e "import('./scripts/sync-tauri-release-version.ts').then(m => process.stdout.write(m.normalizeReleaseVersion(process.env.RAW_VERSION)))")"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux Tauri & X11 system libraries
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --error-on=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop-rust -> target"

      - name: Verify preload bridge unit tests
        run: bun run --cwd apps/desktop-rust test

      # tauri-build only checks that the externalBin exists; unit tests never
      # launch it, so an empty stub avoids compiling the real sidecar here.
      - name: Stub server sidecar for Rust unit tests
        run: |
          mkdir -p apps/desktop-rust/binaries
          touch apps/desktop-rust/binaries/saint-server-x86_64-unknown-linux-gnu

      - name: Verify Rust core unit tests
        run: bun run --cwd apps/desktop-rust test:rust

  build_tauri:
    name: Build Tauri (${{ matrix.label }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux Tauri system libraries
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --error-on=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            file

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop-rust -> target"
          key: ${{ matrix.id }}

      - name: Synchronize release version in Tauri manifests
        run: node scripts/sync-tauri-release-version.ts "${{ needs.preflight.outputs.version }}"

      - name: Build production web client (@saint/web)
        # macOS runners abort (exit 134) at Node's default heap limit.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run --cwd apps/web build

      - name: Build preload bridge (@saint/desktop-rust)
        run: bun run --cwd apps/desktop-rust build:bridge

      # Remote SSH hosts get the server bundle (apps/server/dist/remote) plus the committed
      # dependency pack; the app uploads them from the `remote-install` resource.
      - name: Build and stage the Remote SSH server bundle
        run: |
          bun run --cwd apps/server build
          bun run --cwd apps/desktop-rust build:remote-install

      - name: Build standalone server sidecar
        run: bun run scripts/build-server-sidecar.ts --target "${{ matrix.rust_target }}"

      # Computer Use needs cua-driver next to the app; without it the server
      # reports "Cua Driver is not bundled".
      - name: Provision verified Cua
        if: matrix.platform != 'win'
        uses: ./.github/actions/provision-cua
        with:
          arch: ${{ matrix.arch }}

      # Windows ships the pinned upstream binary, checked against its release
      # checksums; nothing is built, so the native cache action (bash, GNU tar,
      # Linux toolchain probes) is skipped. pwsh keeps Windows' bsdtar, which reads zip.
      - name: Provision verified Cua (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/cua-verified" -replace '\\', '/'
          node apps/desktop-rust/scripts/provision-cua-driver.mjs --platform win32 --arch ${{ matrix.arch }} --destination $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAINT_CUA_ARTIFACT_DIR=$dir" >> $env:GITHUB_ENV

      - name: Stage Cua driver as a bundle resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop-rust/resources/cua-driver
          cp -R "$SAINT_CUA_ARTIFACT_DIR/." apps/desktop-rust/resources/cua-driver/

      - name: Build Tauri native bundles
        working-directory: apps/desktop-rust
        shell: bash
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Resources are merged here, not in tauri.conf.json, so local builds
        # without a provisioned driver keep working. `client` is the web build the
        # server serves to phones paired over the LAN relay.
        run: >-
          bunx @tauri-apps/cli@^2.4.0 build --target "${{ matrix.rust_target }}"
          --config '{"bundle":{"resources":{"resources/cua-driver/":"resources/cua-driver/","resources/remote-install/":"remote-install/","../web/dist/":"client/"}}}'

      - name: Stage platform release assets
        shell: bash
        run: |
          mkdir -p release-tauri-assets
          BUNDLE_DIR="apps/desktop-rust/target/${{ matrix.rust_target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( \
              -name "*.exe" -o \
              -name "*.msi" -o \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.sig" \
            \) -exec cp -v {} release-tauri-assets/ \;
          fi
          # Tauri names both macOS updater archives `Saint.app.tar.gz`; add the
          # arch so the merged release keeps both and latest.json can tell them apart.
          if [ "${{ matrix.platform }}" = "mac" ]; then
            for f in release-tauri-assets/*.app.tar.gz release-tauri-assets/*.app.tar.gz.sig; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              mv -v "$f" "release-tauri-assets/${base%%.app.tar.gz*}_${{ needs.preflight.outputs.version }}_${{ matrix.arch }}.app.tar.gz${base#*.app.tar.gz}"
            done
          fi
          ls -la release-tauri-assets/

      - name: Upload platform Tauri bundles
        uses: actions/upload-artifact@v7
        with:
          name: tauri-desktop-${{ matrix.id }}
          path: release-tauri-assets/*
          if-no-files-found: error
          retention-days: 14

  publish_tauri_release:
    name: Publish Tauri GitHub Release
    needs: [preflight, build_tauri]
    if: needs.preflight.outputs.publish_release == 'true' && (inputs.platform == '' || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download all Tauri platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-desktop-*
          path: tauri-release-artifacts
          merge-multiple: true

      - name: Generate Tauri updater manifest (latest.json)
        run: |
          node scripts/sync-tauri-release-version.ts \
            --generate-latest-json tauri-release-artifacts \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out tauri-release-artifacts/latest.json
          cp tauri-release-artifacts/latest.json tauri-release-artifacts/saint-tauri-latest.json
          cat tauri-release-artifacts/latest.json

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" tauri-release-artifacts/* --clobber
          else
            gh release create "$TAG" tauri-release-artifacts/* --target "$GITHUB_SHA" --title "Saint v$VERSION" --generate-notes --latest
          fi
