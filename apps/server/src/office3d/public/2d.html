<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sơ đồ 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0a0a0a;--card:#0d0d0d;--line:#1c1c1c;--line2:#262626;--text:#fff;--mute:#a6a6a6;--mute2:#6f6f6f;--gold:#ecc970;--ok:#7ccf9b;--warn:#ecc970;--bad:#e8a39b;--claude:#d97757;--codex:#7fb7e8;--antigravity:#a87ffb;--human:#ecc970}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--gold);color:#000;display:grid;place-items:center;font-weight:800}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(124,207,155,.6);animation:pulse 1.6s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,207,155,.55)}70%{box-shadow:0 0 0 7px rgba(124,207,155,0)}100%{box-shadow:0 0 0 0 rgba(124,207,155,0)}}
.kpis{display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto}
.kpi{display:flex;flex-direction:column;min-width:56px}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10px;color:var(--mute2);text-transform:uppercase;letter-spacing:.06em}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;min-height:calc(100vh - 58px)}
.stage{position:relative;padding:10px;overflow:hidden}
svg#office{width:100%;height:auto;display:block}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.alert{font-size:12.5px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:#140f0e;border:1px solid #3a2522;color:var(--bad)}
.alert.warn{background:#15120a;border-color:#3b3218;color:var(--warn)}
.none{font-size:12px;color:var(--mute2)}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.tn{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:#161616;color:var(--mute)}
.task.done .tn{background:rgba(124,207,155,.14);color:var(--ok)}
.task.doing .tn{background:rgba(236,201,112,.14);color:var(--gold)}
.tt{font-size:13px;line-height:1.35}
.tp{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10px;padding:1px 6px;border-radius:999px;background:#151515;color:var(--mute);border:1px solid var(--line2)}
.chip.ok{color:var(--ok);border-color:rgba(124,207,155,.3)}
.ts{font-size:11px;color:var(--mute2);white-space:nowrap}
.ts.warnc{color:var(--bad)}
.detail{font-size:13px;line-height:1.5}
.detail .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--mute)}
.ev{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev time{color:var(--mute2);font-variant-numeric:tabular-nums}
.ev .a{color:var(--mute)}
.ev .ttl{color:var(--text)}
.ev.dev .ttl{color:var(--gold)}
.ev.ceo .ttl{color:var(--gold)}
.ev.fail .ttl{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mute);padding:6px 6px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* SVG */
.room{fill:#080808;stroke:#1f1f1f;stroke-width:1.2}
.roomlbl{fill:#6f6f6f;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.desk{fill:#121212;stroke:#232323}
.screen{transition:fill .4s}
.agent{transition:transform 1.6s cubic-bezier(.45,.05,.2,1);cursor:pointer}
.agent .ring{fill:none;stroke-width:2.2}
.agent.active .ring{stroke:var(--ok);stroke-dasharray:4 4;animation:spin 3s linear infinite;transform-origin:0 0}
.agent.idle .ring{stroke:#3a3a3a}
.agent.away .ring,.agent.offline .ring{stroke:#222}
.agent.away .body,.agent.offline .body{opacity:.45}
.agent.blocked .ring{stroke:var(--bad);stroke-dasharray:none}
.agent.waiting .ring{stroke:var(--warn);stroke-dasharray:2 3}
.agent .name{fill:#d9d9d9;font-size:10.5px;font-weight:600;text-anchor:middle}
.agent .sub{fill:#7a7a7a;font-size:9px;text-anchor:middle}
.agent.sel .name{fill:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.8px)}}
.bubble{font-size:10px;font-weight:600}
.msgdot{filter:drop-shadow(0 0 6px currentColor)}
.rack{fill:#0f0f0f;stroke:#262626}
.led{transition:fill .4s}
.devglow{transition:opacity .6s}
@media (max-width: 980px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  .kpis{margin-left:0;width:100%;justify-content:space-between}
  .stage{padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg#office{min-width:920px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">V</div><span id="ttl">Văn phòng AI</span> <span class="live"><span class="dot" id="live"></span><span id="clock">đang nối…</span></span></div>
  <div class="kpis">
    <div class="kpi"><b id="k-active">–</b><span>Đang làm</span></div>
    <div class="kpi"><b id="k-wait">–</b><span>Chờ / chặn</span></div>
    <div class="kpi"><b id="k-idle">–</b><span>Rảnh</span></div>
    <div class="kpi"><b id="k-dev">–</b><span>DEV</span></div>
    <div class="kpi"><b id="k-tasks">–</b><span>Việc ưu tiên</span></div>
    <div class="kpi"><b id="k-disk">–</b><span>Ổ đĩa trống</span></div>
    <a href="./" style="font-size:11px;color:#a6a6a6;border:1px solid #262626;border-radius:999px;padding:5px 10px;text-decoration:none">Xem 3D</a>
  </div>
</header>
<div class="wrap">
  <div class="stage">
    <svg id="office" viewBox="0 0 1200 780" aria-label="Sơ đồ văn phòng">
      <defs>
        <radialGradient id="devg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#ecc970" stop-opacity=".16"/><stop offset="1" stop-color="#ecc970" stop-opacity="0"/></radialGradient>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0e0e0e" stroke-width="1"/></pattern>
      </defs>
      <rect width="1200" height="780" fill="url(#grid)"/>
      <g id="rooms"></g>
      <g id="links"></g>
      <g id="agents"></g>
      <g id="msgs"></g>
    </svg>
    <div class="legend">
      <span><i style="background:var(--claude)"></i>Claude</span>
      <span><i style="background:var(--codex)"></i>Codex</span>
      <span><i style="background:var(--antigravity)"></i>Antigravity</span>
      <span><i style="background:var(--human)"></i>Giám đốc (bạn)</span>
      <span><i style="border:2px dashed var(--ok)"></i>đang làm</span>
      <span><i style="border:2px dashed var(--warn)"></i>đang chờ</span>
      <span><i style="border:2px solid var(--bad)"></i>bị chặn</span>
      <span>Bấm vào một người để xem họ đang làm gì</span>
    </div>
  </div>
  <aside class="side">
    <div class="sec"><h3>Cảnh báo</h3><div id="alerts"></div></div>
    <div class="sec"><h3>Đang xem <span id="sel-time"></span></h3><div class="detail" id="detail"><span class="none">Bấm vào một người trên sơ đồ.</span></div></div>
    <div class="sec"><h3>Việc ưu tiên <span id="t-sum"></span></h3><div id="tasks"></div></div>
    <div class="sec"><h3>Dòng thời gian hôm nay</h3><div id="timeline"></div></div>
  </aside>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const html = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtT = (ms) => new Date(ms).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
const ago = (ms) => { if (!ms) return "–"; const s = Math.max(0, (Date.now() - ms) / 1000); if (s < 60) return Math.round(s) + " giây"; if (s < 3600) return Math.round(s / 60) + " phút"; if (s < 86400) return (s / 3600).toFixed(1).replace(".", ",") + " giờ"; return Math.round(s / 86400) + " ngày"; };
const COLOR = { claude: "var(--claude)", codex: "var(--codex)", antigravity: "var(--antigravity)", human: "var(--human)" };

// ----- mặt bằng -----
const ROOMS = [
  { id: "ceo", label: "Phòng Giám đốc", x: 20, y: 20, w: 220, h: 170 },
  { id: "manager", label: "Phòng Quản lý", x: 256, y: 20, w: 240, h: 170 },
  { id: "coord", label: "Phòng Điều phối", x: 512, y: 20, w: 350, h: 170 },
  { id: "g1", label: "Kiểm tra & duyệt", x: 878, y: 20, w: 302, h: 300 },
  { id: "claude", label: "Studio Claude", x: 20, y: 206, w: 390, h: 250 },
  { id: "dev", label: "Phòng DEV", x: 426, y: 206, w: 436, h: 250 },
  { id: "codex", label: "Khu kỹ sư Codex", x: 20, y: 472, w: 413, h: 290 },
  { id: "antigravity", label: "Khu Antigravity", x: 449, y: 472, w: 413, h: 290 },
  { id: "queue", label: "Hàng chờ lên DEV", x: 878, y: 336, w: 302, h: 426 },
];
const HOME = { ceo: [130, 112] }; // bàn Giám đốc cố định; nhân viên tự được xếp bàn theo phòng
// Chỗ kê bàn của từng phòng: mở phiên mới là có bàn ngay.
const FREE = {
  manager: [[316, 112], [436, 112]],
  coord: [[572, 112], [692, 112], [812, 112]],
  g1: [[940, 100], [1060, 100], [1130, 160]],
  claude: [[95, 300], [215, 300], [335, 300], [95, 400], [215, 400], [335, 400]],
  codex: [95, 195, 295, 385].flatMap((x) => [[x, 570], [x, 690]]),
  antigravity: [515, 615, 715, 805].flatMap((x) => [[x, 570], [x, 690]]),
  spare: [[500, 420], [790, 420], [500, 300], [790, 300]],
};
function seatFor(a) {
  if (HOME[a.key]) return;
  const taken = Object.values(HOME), free = (p) => !taken.some(([x, y]) => Math.hypot(x - p[0], y - p[1]) < 70);
  HOME[a.key] = (FREE[a.room] || []).find(free) || FREE.spare.find(free) || FREE.codex.find(free) || FREE.antigravity.find(free) || [600, 400];
  addDesk(a.key, HOME[a.key][0], HOME[a.key][1]);
}
const DEV_SEAT = [644, 300], G1Q = [[940, 220], [1000, 220], [1060, 220], [1120, 220], [970, 270], [1030, 270], [1090, 270]];

const roomsG = $("rooms"), agentsG = $("agents"), msgsG = $("msgs"), linksG = $("links");
for (const r of ROOMS) {
  el("rect", { class: "room", x: r.x, y: r.y, width: r.w, height: r.h, rx: 16 }, roomsG);
  el("text", { class: "roomlbl", x: r.x + 14, y: r.y + 22 }, roomsG).textContent = r.label;
}
// đèn sáng phòng DEV
const devGlow = el("rect", { x: 426, y: 206, width: 436, height: 250, rx: 16, fill: "url(#devg)", class: "devglow", opacity: 0 }, roomsG);
const devHolderTxt = el("text", { x: 644, y: 248, "text-anchor": "middle", fill: "#a6a6a6", "font-size": 11 }, roomsG);
const devPkgTxt = el("text", { x: 644, y: 264, "text-anchor": "middle", fill: "#6f6f6f", "font-size": 10 }, roomsG);
const rackG = el("g", {}, roomsG);
const queueG = el("g", {}, roomsG);
// bàn làm việc
const desks = {};
function addDesk(k, x, y) {
  const g = el("g", { transform: `translate(${x},${y})` }, roomsG);
  el("rect", { class: "desk", x: -38, y: -40, width: 76, height: 22, rx: 6 }, g);
  desks[k] = el("rect", { class: "screen", x: -18, y: -50, width: 36, height: 12, rx: 3, fill: "#1a1a1a" }, g);
}
for (const [k, [x, y]] of Object.entries(HOME)) addDesk(k, x, y);
el("rect", { class: "desk", x: 600, y: 316, width: 88, height: 22, rx: 6 }, roomsG);

// ----- nhân vật -----
const nodes = {};
let selected = null;
function makeAgent(a) {
  const g = el("g", { class: "agent" }, agentsG);
  const body = el("g", { class: "body" }, g);
  el("circle", { class: "ring", r: 19 }, g);
  const inner = el("g", { class: "bob" }, body);
  el("ellipse", { cx: 0, cy: 16, rx: 12, ry: 3, fill: "#000", opacity: .6 }, body);
  el("rect", { x: -11, y: -12, width: 22, height: 22, rx: 8, fill: COLOR[a.platform] }, inner);
  el("rect", { x: -8, y: -8, width: 16, height: 8, rx: 3, fill: "#0b0b0b" }, inner);
  el("circle", { cx: -3.5, cy: -4, r: 1.6, fill: "#fff" }, inner);
  el("circle", { cx: 3.5, cy: -4, r: 1.6, fill: "#fff" }, inner);
  if (a.platform === "human") el("path", { d: "M-8 -14 L-4 -19 L0 -14 L4 -19 L8 -14 Z", fill: "#ecc970" }, inner);
  const sub = el("g", {}, g);
  const name = el("text", { class: "name", y: 34 }, g); name.textContent = a.name.split(" · ")[0];
  const role = el("text", { class: "sub", y: 45 }, g); role.textContent = a.role;
  const bubble = el("g", { transform: "translate(0,-34)", opacity: 0 }, g);
  const bRect = el("rect", { x: -38, y: -11, width: 76, height: 16, rx: 8 }, bubble);
  const bTxt = el("text", { class: "bubble", y: 1, "text-anchor": "middle" }, bubble);
  g.addEventListener("click", () => { selected = a.key; render(last); });
  nodes[a.key] = { g, sub, bubble, bRect, bTxt, x: null, y: null };
  return nodes[a.key];
}
function posFor(a, gIdx) {
  if (a.where === "dev") return DEV_SEAT;
  if (a.where === "g1q") return G1Q[Math.min(gIdx, G1Q.length - 1)];
  return HOME[a.key] || [600, 400];
}

// ----- tin nhắn bay giữa các bàn -----
const seenMsg = new Set();
let firstLoad = true;
function flyMsg(e) {
  const A = nodes[e.from], B = nodes[e.to];
  if (!A || !B || A.x == null || B.x == null) return;
  const col = e.kind === "ceo" ? "#ecc970" : (/GẤP|CHẶN/.test(e.title) ? "#e8a39b" : "#7ccf9b");
  const mx = (A.x + B.x) / 2, my = Math.min(A.y, B.y) - 60;
  const d = `M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}`;
  const path = el("path", { d, fill: "none", stroke: col, "stroke-width": 1, "stroke-dasharray": "2 5", opacity: .55 }, linksG);
  const dot = el("circle", { r: 4.5, fill: col, class: "msgdot", style: `color:${col}` }, msgsG);
  const anim = el("animateMotion", { dur: "1.8s", fill: "freeze", path: d }, dot);
  anim.beginElement && anim.beginElement();
  const lbl = el("text", { x: mx, y: my + 22, "text-anchor": "middle", fill: col, "font-size": 10, opacity: .9 }, linksG);
  lbl.textContent = e.title.slice(0, 46);
  setTimeout(() => { dot.remove(); }, 2000);
  setTimeout(() => { path.remove(); lbl.remove(); }, 9000);
}

// ----- vẽ -----
let last = null;
function render(s) {
  if (!s) return;
  last = s;
  const agents = s.agents;
  // KPI
  const act = agents.filter((a) => a.platform !== "human" && a.status === "active").length;
  const wait = agents.filter((a) => a.flag).length;
  const idle = agents.filter((a) => a.status === "idle" && !a.flag).length;
  $("k-active").textContent = act; $("k-wait").textContent = wait; $("k-idle").textContent = idle;
  const holder = agents.find((a) => a.key === s.dev.holder);
  $("k-dev").textContent = holder ? holder.name.split(" · ")[0] : (s.dev.holderLabel ? "đang giữ" : "trống " + ago(s.dev.idleSince));
  const done = s.tasks.filter((t) => t.state === "done").length;
  $("k-tasks").textContent = `${done}/${s.tasks.length} xong`;
  document.title = "Sơ đồ 2D · " + s.title; $("ttl").textContent = s.title;
  $("k-disk").textContent = s.sys.cFreeGB != null ? s.sys.cFreeGB.toString().replace(".", ",") + " GB" : "–";
  $("clock").textContent = "trực tiếp · " + new Date(s.now).toLocaleTimeString("vi-VN");
  // phòng DEV
  devGlow.setAttribute("opacity", s.dev.holder || s.dev.holderLabel ? 1 : 0);
  devHolderTxt.textContent = holder ? `${holder.name.split(" · ")[0]} đang giữ lượt · ${ago(s.dev.holderSince)}` : (s.dev.holderLabel ? s.dev.holderLabel : `DEV đang trống · ${ago(s.dev.idleSince)}`);
  devPkgTxt.textContent = s.dev.package || "";
  rackG.textContent = "";
  const cs = s.sys.containers;
  cs.forEach((c, i) => {
    const x = 458 + (i % 5) * 80, y = 360 + Math.floor(i / 5) * 42;
    el("rect", { class: "rack", x, y, width: 70, height: 32, rx: 6 }, rackG);
    const okc = c.state === "running" && !/unhealthy|Restarting/i.test(c.status);
    el("circle", { class: "led", cx: x + 10, cy: y + 11, r: 3.5, fill: okc ? "#7ccf9b" : "#e8a39b" }, rackG);
    const t = el("text", { x: x + 18, y: y + 14, fill: "#a6a6a6", "font-size": 9 }, rackG); t.textContent = c.name.slice(0, 12);
    const t2 = el("text", { x: x + 8, y: y + 26, fill: "#5f5f5f", "font-size": 8 }, rackG); t2.textContent = c.status.replace(/About |\(healthy\)/g, "").slice(0, 16);
  });
  // hàng chờ DEV
  queueG.textContent = "";
  (s.dev.queue || []).slice(0, 9).forEach((q, i) => {
    const y = 372 + i * 42;
    el("rect", { x: 892, y, width: 274, height: 34, rx: 8, fill: "#0d0d0d", stroke: "#1f1f1f" }, queueG);
    const n = el("text", { x: 904, y: y + 21, fill: "#ecc970", "font-size": 11, "font-weight": 700 }, queueG); n.textContent = q.n;
    const t = el("text", { x: 922, y: y + 15, fill: "#e5e5e5", "font-size": 10 }, queueG); t.textContent = q.what.slice(0, 40);
    const w = el("text", { x: 922, y: y + 27, fill: "#6f6f6f", "font-size": 9 }, queueG); w.textContent = q.who.slice(0, 44);
  });
  // nhân vật
  let gIdx = 0;
  for (const a of agents) {
    seatFor(a);
    const n = nodes[a.key] || makeAgent(a);
    const [x, y] = posFor(a, a.where === "g1q" ? gIdx++ : 0);
    n.x = x; n.y = y;
    n.g.setAttribute("transform", `translate(${x},${y})`);
    n.g.setAttribute("class", `agent ${a.status} ${a.flag || ""} ${selected === a.key ? "sel" : ""}`);
    const scr = desks[a.key];
    if (scr) scr.setAttribute("fill", a.flag === "blocked" ? "#e8a39b" : a.status === "active" ? "#7ccf9b" : a.status === "idle" ? "#2a2a2a" : "#141414");
    // bong bóng
    let label = "", col = "";
    if (a.flag === "blocked") { label = "bị chặn"; col = "#e8a39b"; }
    else if (a.flag === "waiting") { label = `chờ lượt DEV #${a.queuePos || ""}`; col = "#ecc970"; }
    else if (a.where === "dev") { label = "đang trên DEV"; col = "#ecc970"; }
    else if (a.sub) { label = `${a.sub} phiên con đang chạy`; col = "#7fb7e8"; }
    n.bubble.setAttribute("opacity", label ? 1 : 0);
    n.bRect.setAttribute("fill", "#0b0b0b"); n.bRect.setAttribute("stroke", col || "#333");
    n.bTxt.setAttribute("fill", col || "#aaa"); n.bTxt.textContent = label;
    const wdt = Math.max(60, label.length * 5.6 + 14); n.bRect.setAttribute("width", wdt); n.bRect.setAttribute("x", -wdt / 2);
    // phiên con quanh trợ lý
    n.sub.textContent = "";
    for (let i = 0; i < Math.min(a.sub, 6); i++) el("circle", { cx: -24 + i * 9, cy: 52, r: 3.2, fill: COLOR[a.platform], opacity: .8 }, n.sub);
  }
  // tin nhắn mới
  for (const e of s.events) {
    const id = `${e.t}|${e.from}|${e.to}|${e.title}`;
    if (seenMsg.has(id)) continue;
    seenMsg.add(id);
    if (!firstLoad && Date.now() - e.t < 120000) flyMsg(e);
  }
  firstLoad = false;
  renderSide(s);
}
function renderSide(s) {
  // cảnh báo
  const al = $("alerts"); al.textContent = "";
  if (!s.alerts.length) al.appendChild(html("div", "none", "Không có cảnh báo."));
  for (const a of s.alerts) al.appendChild(html("div", "alert " + (a.level === "warn" ? "warn" : ""), a.text));
  // chi tiết
  const d = $("detail"); d.textContent = "";
  const a = s.agents.find((x) => x.key === selected);
  if (a) {
    const who = html("div", "who");
    const sw = html("span", "badge", a.platform === "codex" ? "Codex" : a.platform === "antigravity" ? "Antigravity" : a.platform === "claude" ? "Claude" : "Người");
    who.appendChild(html("b", "", a.name)); who.appendChild(sw);
    d.appendChild(who);
    const st = { active: "đang làm", idle: "đang rảnh / chờ", away: "nghỉ lâu", offline: "không đọc được nhật ký" }[a.status] || a.status;
    d.appendChild(html("div", "", `Vai trò: ${a.role}`));
    d.appendChild(html("div", "", `Trạng thái: ${st}${a.flag === "blocked" ? " · bị chặn" : a.flag === "waiting" ? " · chờ lượt DEV" : ""}`));
    d.appendChild(html("div", "", `Hoạt động gần nhất: ${ago(a.lastActive)} trước`));
    if (a.lastText) { const p = html("p", "", "“" + a.lastText + "”"); p.style.color = "#cfcfcf"; d.appendChild(p); }
    $("sel-time").textContent = a.lastTextAt ? fmtT(a.lastTextAt) : "";
  } else d.appendChild(html("span", "none", "Bấm vào một người trên sơ đồ."));
  // việc ưu tiên
  const tk = $("tasks"); tk.textContent = "";
  for (const t of s.tasks) {
    const row = html("div", "task " + t.state);
    row.appendChild(html("div", "tn", t.state === "done" ? "✓" : String(t.n)));
    const mid = html("div");
    mid.appendChild(html("div", "tt", `${t.n}. ${t.name}`));
    if (t.parts.length > 1) { const p = html("div", "tp"); for (const x of t.parts) p.appendChild(html("span", "chip" + (x.dat ? " ok" : ""), x.id)); mid.appendChild(p); }
    row.appendChild(mid);
    const st = { done: "đạt", doing: "đang làm", todo: "chưa làm" }[t.state];
    row.appendChild(html("div", "ts" + (t.lanSua >= 3 && t.state !== "done" ? " warnc" : ""), st + (t.lanSua ? ` · sửa ${t.lanSua}` : "")));
    tk.appendChild(row);
  }
  $("t-sum").textContent = `${s.tasks.filter((t) => t.state === "done").length}/${s.tasks.length}`;
  // dòng thời gian
  const name = (k) => (s.agents.find((x) => x.key === k) || { name: k }).name.split(" · ")[0];
  const items = [];
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  for (const e of s.events) if (e.t >= day0) items.push({ t: e.t, cls: e.kind === "ceo" ? "ceo" : "", a: `${name(e.from)} → ${name(e.to)}`, ttl: e.title });
  for (const r of s.dev.lastRows) if (r.t >= day0) items.push({ t: r.t, cls: "dev" + (r.fail ? " fail" : ""), a: `DEV · ${r.agent ? name(r.agent) : r.who}`, ttl: r.state });
  items.sort((x, y) => y.t - x.t);
  const tl = $("timeline"); tl.textContent = "";
  for (const it of items.slice(0, 60)) {
    const row = html("div", "ev " + it.cls);
    row.appendChild(html("time", "", fmtT(it.t)));
    const b = html("div"); b.appendChild(html("div", "a", it.a)); b.appendChild(html("div", "ttl", it.ttl)); row.appendChild(b);
    tl.appendChild(row);
  }
}
// ----- nối dữ liệu -----
let lastMsgAt = 0;
function connect() {
  const es = new EventSource("events");
  es.onmessage = (m) => { lastMsgAt = Date.now(); $("live").className = "dot"; try { render(JSON.parse(m.data)); } catch (e) { console.error(e); } };
  es.onerror = () => { $("live").className = "dot off"; };
}
// Mạng điện thoại chặn luồng trực tiếp thì tự hỏi mỗi giây.
setInterval(async () => {
  if (Date.now() - lastMsgAt < 3000) return;
  try { const r = await fetch("state", { cache: "no-store" }); if (r.ok) { $("live").className = "dot"; render(await r.json()); } }
  catch { $("live").className = "dot off"; $("clock").textContent = "mất kết nối, đang nối lại…"; }
}, 1000);
connect();
</script>
