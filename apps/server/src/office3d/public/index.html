<style>
:root{--gold:#ecc970;--ok:#7ccf9b;--warn:#ecc970;--bad:#e8a39b;--mute:#a6a6a6;--mute2:#6b6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#f2f2f2;font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#world{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 10%,#16202c 0%,#0a0e14 45%,#040507 100%)}
#css3d,#gl,#lbl{position:absolute;inset:0}
#css3d{pointer-events:none}
#css3d.live{pointer-events:auto}
#lbl,#gl{pointer-events:none}
#gl canvas{pointer-events:auto}
.bar{position:fixed;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:14px;z-index:10;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(8,10,13,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 12px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--gold);color:#000;display:grid;place-items:center;font-weight:800}
.ttl b{display:block;font-size:14px}.ttl small{font-size:10px;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase}
.clock{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700}
.live{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ok);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 1.4s infinite}
.live.off{color:var(--bad)}.live.off i{background:var(--bad);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(124,207,155,.6)}70%{box-shadow:0 0 0 8px rgba(124,207,155,0)}100%{box-shadow:none}}
.k{display:flex;gap:14px}
.k div{display:flex;flex-direction:column}
.k b{font-family:"JetBrains Mono",monospace;font-size:16px}
.k span{font-size:9px;color:var(--mute2);letter-spacing:.1em;text-transform:uppercase}
.sp{flex:1}
body.zoomed .bar .pill,body.zoomed .card,body.zoomed .hint,body.zoomed .links{display:none}
body.zoomed .bar{top:auto;bottom:14px;left:auto;right:14px;z-index:30}
#full{position:fixed;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .35s ease,transform .35s ease}
#full.show{opacity:1;pointer-events:auto;transform:none}
#full iframe{width:100%;height:100%;border:0;display:block}
.ask{text-decoration:none;color:inherit;gap:6px}
.ask b{font-family:"JetBrains Mono",monospace;font-size:16px}
.ask span{font-size:10px;color:#9aa3ad;letter-spacing:.04em}
.ask.on{border-color:rgba(236,201,112,.6);box-shadow:0 0 0 1px rgba(236,201,112,.25)}
.ask.on b{color:var(--gold)}
@media (max-width: 760px){ .ask:not(#ask){display:none} }
.btn{pointer-events:auto;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:#000;background:var(--gold);border:0;border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(236,201,112,.25)}
.btn.ghost{background:rgba(8,10,13,.72);color:#e9e9e9;border:1px solid rgba(255,255,255,.12);box-shadow:none}
.hint{position:fixed;left:12px;bottom:10px;font-size:11px;color:var(--mute2);z-index:10;pointer-events:none}
.links{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;z-index:10}
.links a{font-size:10.5px;color:var(--mute);text-decoration:none;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 9px;background:rgba(8,10,13,.6)}
.lb{text-align:center;cursor:pointer;pointer-events:auto;user-select:none;transform:translateY(-4px)}
.lb .n{font-size:11px;font-weight:700;color:#f4f4f4;text-shadow:0 1px 4px #000,0 0 2px #000;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis;margin:0 auto}
.lb.sel .n{color:var(--gold)}
.lb .b{display:inline-block;margin-bottom:4px;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(5,6,8,.85);border:1px solid;white-space:nowrap}
.rl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7c8794;font-weight:700;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000}
.dl{font-size:11px;color:#e8e8e8;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;white-space:nowrap}
.dl small{display:block;color:#9aa3ad;font-size:9.5px}
.say{display:block;max-width:320px;max-height:170px;overflow:auto;pointer-events:auto;margin:0 auto 6px;font-size:10.5px;font-weight:600;line-height:1.35;padding:6px 9px;border-radius:12px;background:rgba(6,8,11,.92);border:1px solid;white-space:normal;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.say small{display:block;font-size:9px;opacity:.75;font-weight:700;letter-spacing:.04em;margin-bottom:2px}
@keyframes pop{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mt{min-width:230px;max-width:360px;padding:8px 12px;border-radius:12px;background:rgba(6,8,11,.9);border:1px solid;font-size:11px;line-height:1.45;color:#e2e2e2;pointer-events:none;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.55)}
.mt b{display:block;font-size:12.5px;margin-bottom:2px}
.mt i{display:block;font-style:normal;color:#9aa3ad;font-size:10px;margin-bottom:4px}
.mt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.idle{min-width:0;padding:3px 10px;border-color:rgba(255,255,255,.14);color:#7c8794;font-size:10px;letter-spacing:.06em}
.ml{font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(5,6,8,.85);border:1px solid;white-space:nowrap;pointer-events:none}
.card{position:fixed;left:12px;top:70px;width:min(360px,calc(100vw - 24px));z-index:12;background:rgba(8,10,13,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;display:none}
.card{max-height:calc(100vh - 90px);overflow:auto}
.card h4{margin:0 0 4px;display:flex;justify-content:space-between;font-size:14px}
.card button{background:none;border:1px solid rgba(255,255,255,.15);color:#ccc;border-radius:8px;cursor:pointer;font:inherit;font-size:11px;padding:1px 8px}
.card p{color:#d4d4d4;margin:8px 0 0}
.card .m{color:var(--mute2);font-size:11.5px}
@media (max-width: 760px){ .zbtn{padding:8px 9px!important;font-size:11px!important} .k{display:none} .ttl small{display:none} .clock{font-size:16px} .btn{padding:9px 11px;font-size:12px} .links a:first-child{display:none} }

<body>
<div id="world"><div id="css3d"></div><div id="gl"></div><div id="lbl"></div></div>

  <div class="pill"><div class="logo">V</div><div class="ttl"><b id="ttl">Văn phòng AI</b><small id="sub">Công ty AI · trực tiếp</small></div></div>

<div class="card" id="card"></div>

<div class="links"><a href="tongquan.html">Tổng quan</a><a href="hopthu.html">Hòm thư</a><a href="hieusuat.html">Đánh giá nhân sự</a><a href="board.html">Mở bảng điều hành toàn màn hình</a><a href="2d.html">Sơ đồ 2D</a></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

if (!window.name) window.name = "vp3d";
const $ = (id) => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ago = (ms) => { if (!ms) return "–"; const s = Math.max(0, (Date.now() - ms) / 1000); if (s < 60) return Math.round(s) + " giây"; if (s < 3600) return Math.round(s / 60) + " phút"; return (s / 3600).toFixed(1).replace(".", ",") + " giờ"; };
// Nhãn trên bản đồ chỉ giữ tên ngắn; tên đầy đủ nằm trong thẻ khi bấm và tooltip khi rê chuột.
const SHORT_NAME_MAX = 10;
// Dòng vai trò bên dưới đã ghi nền tảng, nên bỏ tiền tố "Claude"/"Antigravity"… để giữ phần phân biệt.
const PLATFORM_PREFIX = /^(Claude|Codex|Antigravity|Cursor|Gemini|Grok|Droid|OpenCode|Devin|Pi)\s+(?=\S)/i;
const short = (n) => { const s = n.split(" · ")[0].trim().replace(PLATFORM_PREFIX, ""); return s.length > SHORT_NAME_MAX ? s.slice(0, SHORT_NAME_MAX - 1).trimEnd() + "…" : s; };
const PCOL = { claude: 0xd9734a, codex: 0x3f8fd9, antigravity: 0xa87ffb, human: 0xecc970 };
const pName = (p) => p === "codex" ? "Codex" : p === "antigravity" ? "Antigravity" : p === "claude" ? "Claude" : "Người";
const SC = { ok: 0x7ccf9b, warn: 0xecc970, bad: 0xe8a39b, idle: 0x3a4048, off: 0x1c1f24 };

// Ba lớp vẽ: trang HTML của màn hình lớn (dưới) · WebGL có lỗ trong suốt (giữa) · nhãn tên (trên).
const cssR = new CSS3DRenderer(); $("css3d").appendChild(cssR.domElement);
const gl = new THREE.WebGLRenderer({ antialias: true, alpha: true });
gl.setPixelRatio(Math.min(devicePixelRatio, 1.75)); gl.setClearColor(0x000000, 0);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.0;
$("gl").appendChild(gl.domElement);
const lblR = new CSS2DRenderer(); $("lbl").appendChild(lblR.domElement);
const scene = new THREE.Scene(), cssScene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e14, 300, 520);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 800); // góc rộng để thấy trọn bức tường 3 màn hình
const controls = new OrbitControls(camera, gl.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.38; controls.minDistance = 14; controls.maxDistance = 260;
const S = 8; // 1 đơn vị 3D = 8 px mặt bằng: văn phòng rộng hơn 25%
const X = (x) => (x - 600) / S, Z = (y) => (y - 390) / S;
const HOME_CAM = { pos: new THREE.Vector3(0, 58, 158), target: new THREE.Vector3(0, 32, -20) }; // nhìn cao lên: 3 màn hình chiếm nửa trên, văn phòng nửa dưới
function resize() {
  const w = innerWidth, hh = innerHeight;
  gl.setSize(w, hh); lblR.setSize(w, hh); cssR.setSize(w, hh);
  camera.aspect = w / hh; camera.updateProjectionMatrix();
  const k = 1.7 * Math.max(1, 1.7 / camera.aspect); HOME_CAM.pos.set(0, 58 * k, 158 * k); // lùi ra để thấy đủ 3 màn hình
}
addEventListener("resize", resize); resize();
camera.position.copy(HOME_CAM.pos); controls.target.copy(HOME_CAM.target);
controls.maxDistance = 340;

// ánh sáng thật: môi trường phản chiếu + nắng có bóng đổ
gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFSoftShadowMap;
const pmrem = new THREE.PMREMGenerator(gl);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a1f16, 0.35));
const key = new THREE.DirectionalLight(0xfff1dc, 1.7); key.position.set(-60, 110, 70); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -100, right: 100, top: 70, bottom: -70, near: 10, far: 320 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.45); fill.position.set(70, 50, 90); scene.add(fill);
const devLight = new THREE.PointLight(0xecc970, 0, 60, 2); scene.add(devLight);

const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.1, ...o });
const add = (m, x, y, z, parent = scene) => { m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
function tex(w, hh, draw, rx = 1, ry = 1) { const c = document.createElement("canvas"); c.width = w; c.height = hh; draw(c.getContext("2d"), w, hh); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t; }
const woodTex = tex(512, 512, (g, w, hh) => {
  const rows = 8, rh = hh / rows;
  for (let r = 0; r < rows; r++) {
    let x = -Math.random() * 200;
    while (x < w) {
      const len = 160 + Math.random() * 180, l = 34 + Math.random() * 10;
      g.fillStyle = `hsl(28, 32%, ${l}%)`; g.fillRect(x, r * rh, len, rh);
      for (let i = 0; i < 6; i++) { g.strokeStyle = `rgba(40,22,10,${0.05 + Math.random() * .08})`; g.lineWidth = 1; g.beginPath(); const yy = r * rh + Math.random() * rh; g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + 3, x + len * .6, yy - 3, x + len, yy); g.stroke(); }
      g.fillStyle = "rgba(20,10,4,.55)"; g.fillRect(x, r * rh, 2, rh);
      x += len;
    }
    g.fillStyle = "rgba(20,10,4,.6)"; g.fillRect(0, r * rh, w, 2);
  }
}, 14, 10);
const carpetTex = tex(256, 256, (g, w, hh) => { g.fillStyle = "#808080"; g.fillRect(0, 0, w, hh); for (let i = 0; i < 9000; i++) { const v = 110 + Math.random() * 40; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * w, Math.random() * hh, 1.5, 1.5); } }, 6, 6);

// sàn gỗ toàn văn phòng + tường bao thấp
const OW = 1200 / S + 14, OD = 780 / S + 14;
const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(OW, OD), std(0xffffff, { map: woodTex, roughness: .5, metalness: .05 })), 0, 0, 0); floor.rotation.x = -Math.PI / 2; floor.castShadow = false;
const outerMat = std(0xe9e6e1, { roughness: .85 });
add(new THREE.Mesh(new THREE.BoxGeometry(OW, 3, 0.6), outerMat), 0, 1.5, OD / 2);
for (const sx of [-1, 1]) add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, OD), outerMat), sx * OW / 2, 1.5, 0);
const skirting = std(0x2a2622, { roughness: .6 });
add(new THREE.Mesh(new THREE.BoxGeometry(OW, 0.35, 0.66), skirting), 0, 0.18, OD / 2 - 0.02);

// phòng: thảm + vách kính khung nhôm
const ROOMS = [
  { id: "ceo", label: "Phòng Giám đốc", x: 20, y: 20, w: 220, h: 170, tone: 0x8a6a3a },
  { id: "manager", label: "Phòng Quản lý", x: 256, y: 20, w: 240, h: 170, tone: 0x5c6470 },
  { id: "coord", label: "Phòng Điều phối", x: 512, y: 20, w: 350, h: 170, tone: 0x5c6470 },
  { id: "g1", label: "Kiểm tra & duyệt", x: 878, y: 20, w: 302, h: 300, tone: 0x4d6a86 },
  { id: "claude", label: "Studio Claude", x: 20, y: 206, w: 390, h: 250, tone: 0x8a5a44 },
  { id: "dev", label: "Phòng DEV", x: 426, y: 206, w: 436, h: 250, tone: 0x3a3a40 },
  { id: "codex", label: "Khu kỹ sư Codex", x: 20, y: 472, w: 413, h: 290, tone: 0x3f5a78 },
  { id: "antigravity", label: "Khu Antigravity", x: 449, y: 472, w: 413, h: 290, tone: 0x56437a },
  { id: "lounge", label: "Phòng họp", x: 878, y: 336, w: 302, h: 426, tone: 0x6a6e74 },
];
const glassMat = new THREE.MeshStandardMaterial({ color: 0xd9ecff, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0.1, depthWrite: false });
const alu = std(0xb8bcc2, { metalness: .9, roughness: .25 });
function glassWall(x1, z1, x2, z2, hgt = 3.4) {
  const len = Math.hypot(x2 - x1, z2 - z1), ang = Math.atan2(z2 - z1, x2 - x1), cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = -ang; scene.add(g);
  const pane = new THREE.Mesh(new THREE.BoxGeometry(len, hgt, 0.06), glassMat); pane.position.y = hgt / 2; g.add(pane);
  add(new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.14), alu), 0, hgt, 0, g);
  add(new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.14), alu), 0, 0.06, 0, g);
  const n = Math.max(1, Math.round(len / 7));
  for (let i = 0; i <= n; i++) add(new THREE.Mesh(new THREE.BoxGeometry(0.12, hgt, 0.14), alu), -len / 2 + (len / n) * i, hgt / 2, 0, g);
}
for (const r of ROOMS) {
  const x0 = X(r.x) + .3, x1 = X(r.x + r.w) - .3, z0 = Z(r.y) + .3, z1 = Z(r.y + r.h) - .3;
  const rug = add(new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.08, z1 - z0), std(r.tone, { map: carpetTex, roughness: .95 })), (x0 + x1) / 2, 0.04, (z0 + z1) / 2); rug.castShadow = false;
  glassWall(x0, z0, x1, z0); glassWall(x0, z0, x0, z1); glassWall(x1, z0, x1, z1);
  const gap = Math.min(6, (x1 - x0) * .25); glassWall(x0, z1, (x0 + x1) / 2 - gap / 2, z1); glassWall((x0 + x1) / 2 + gap / 2, z1, x1, z1);
  const lab = new CSS2DObject(h("div", "rl", r.label)); lab.position.set(x0 + 1.2, 4.2, z0 + 1.2); lab.center.set(0, .5); scene.add(lab);
}

// cây xanh
function plant(x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.6, 1.5, 24), std(0xf2f0ec, { roughness: .35 })), 0, .75, 0, g);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, .1, 24), std(0x3a2a1c)), 0, 1.48, 0, g);
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, leaf = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), std(i % 2 ? 0x3f7d4f : 0x2f6a40, { roughness: .7 })); leaf.scale.set(.55, 1.6, .3); leaf.rotation.set(Math.cos(a) * .6, a, Math.sin(a) * .6); add(leaf, Math.cos(a) * .5, 2.6 + (i % 3) * .3, Math.sin(a) * .5, g); }
}
for (const [x, y] of [[232, 32], [854, 32], [30, 466], [854, 466], [1170, 330], [1170, 752], [30, 752], [412, 466], [500, 200], [1170, 32]]) plant(X(x), Z(y), 1.05);

const meetLbl = h("div", "mt idle", "PHÒNG HỌP · TRỐNG"); const meetLblO = new CSS2DObject(meetLbl); meetLblO.position.set(MT.x, 9.5, MT.z); scene.add(meetLblO);
function classify(e) {

function canMeet(k) { const a = last && last.agents.find((x) => x.key === k); return !!(bots[k] && a && a.where !== "dev"); }

}

function startMeet(kind, e, past) {

setInterval(() => {

// ---------- phóng vào màn hình lớn ----------
let anim = null, zoomed = false;

// Xem màn hình lớn: camera lướt tới màn hình rồi bảng điều hành phủ kín đúng khổ màn hình máy tính (không méo).

}
addEventListener("keydown", (e) => { if (e.key === "Escape" && zoomed) setZoom(null); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

// ---------- vòng vẽ ----------
const clock = new THREE.Clock();

// Tên nào đè lên tên đã đặt thì ẩn đi; zoom gần là hiện lại. Ưu tiên: người đang chọn, người đang
// làm, rồi người gần camera hơn (thấp hơn trên màn hình).

// ---------- dữ liệu ----------
let last = null; const seen = new Set(); let first = true;
function apply(s) {

  $("clock").textContent = new Date(s.now).toLocaleTimeString("vi-VN", { hour12: false });

  $("k2").textContent = A.filter((a) => a.flag).length;

  document.title = s.title; $("ttl").textContent = s.title; $("sub").textContent = s.subtitle || "";
  $("askN").textContent = s.asks.length; $("ask").classList.toggle("on", s.asks.length > 0);

  s.sys.containers.forEach((c, i) => { const ok = c.state === "running" && !/unhealthy|Restarting/i.test(c.status); if (c.retired) return racks[i]?.leds.forEach((l) => l.material.color.setHex(0x23262b)); racks[i]?.leds.forEach((l, j) => l.material.color.setHex(ok ? (Math.random() > .25 || j % 2 ? 0x7ccf9b : 0x2f6b48) : (j % 2 ? 0xe8a39b : 0x5a2b27))); });

  for (const a of A) {
    const fresh = seatFor(a);
    const b = bots[a.key] || (bots[a.key] = makeBot(a));
    if (fresh && !first) say(b, "🆕 Nhân viên mới", `Chào cả phòng, em là ${short(a.name)} (${pName(a.platform)}), vừa vào làm.`, "#ecc970", 20000);
    const p = a.where === "dev" ? DEV_SEAT : a.where === "g1q" ? G1Q[Math.min(q++, G1Q.length - 1)] : (HOME[a.key] || [600, 400]);
    b.target.set(X(p[0]), 0.14, Z(p[1]) + (a.where === "dev" || a.where === "g1q" ? 0 : -0.6));
    if (b.meet && meet && a.where === "dev") { leave(a.key, meet); delete meet.slots[a.key]; meet.members = meet.members.filter((x) => x !== a.key); }
    if (b.meet && meet && meet.slots[a.key] !== undefined) b.target.copy(seatOf(a.key).p);
    else if (b.visit && Date.now() < b.visit.until && bots[b.visit.to] && a.where !== "dev") { const tg = bots[b.visit.to].g.position; b.target.set(tg.x + 4.2, 0.14, tg.z + 1.5); }
    else b.visit = null;

    if (!first && a.lastText && a.lastTextAt && a.lastTextAt !== b.saidAt && Date.now() - a.lastTextAt < 60000) { b.saidAt = a.lastTextAt; say(b, a.platform === "human" ? "🗣 Giám đốc nói" : "🗣 Báo cáo", a.lastText, a.platform === "human" ? "#ecc970" : "#cfd8e3", 15000); }
    else if (first) b.saidAt = a.lastTextAt;

  first = false;

}

  const h4 = h("h4", "", a.name.split(" · ")[0]); const x = h("button", "", "Đóng"); x.onclick = () => { selected = null; c.style.display = "none"; showCard(); }; h4.appendChild(x); info.appendChild(h4);
  const st = a.flag === "blocked" ? "bị chặn" : a.flag === "waiting" ? `chờ lượt DEV #${a.queuePos || ""}` : a.where === "dev" ? "đang trên DEV" : { active: "đang làm", idle: "đang rảnh", away: "nghỉ lâu", offline: "không đọc được nhật ký" }[a.status];
  info.append(h("div", "m", `${a.role} · ${pName(a.platform)} · ${st} · hoạt động ${ago(a.lastActive)} trước`));
  if (a.lastText) info.appendChild(h("p", "", "“" + a.lastText + "”"));

}
window.thuTin = (from, to, title, kind = "msg") => handle({ t: Date.now(), kind, from, to, title }, true); // thử hiệu ứng tin nhắn
let lastMsgAt = 0;
const es = new EventSource("events");
es.onmessage = (m) => { lastMsgAt = Date.now(); $("live").className = "live"; try { apply(JSON.parse(m.data)); } catch (e) { console.error(e); } };

setInterval(async () => { if (Date.now() - lastMsgAt < 3000) return; try { const r = await fetch("state", { cache: "no-store" }); if (r.ok) { $("live").className = "live"; apply(await r.json()); } } catch { $("live").className = "live off"; } }, 1000);
