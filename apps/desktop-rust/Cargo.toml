[package]
name = "saint-desktop"
version = "1.2.3"
description = "Saint Desktop Shell (Rust / Tauri v2)"
authors = ["Locotine"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "saint_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "saint-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
tauri = { version = "2.4.0", features = ["unstable", "devtools", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-updater = "2.6.0"
tauri-plugin-clipboard-manager = "2.2.0"

window-vibrancy = "0.6.0"
portable-pty = "0.9.0"

tokio = { version = "1.44.0", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "net",
  "sync",
  "time",
  "io-util",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
uuid = { version = "1.15", features = ["v4", "serde"] }
base64 = "0.22"
png = "0.18"
url = "2.5"
dirs = "6.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
rusty-leveldb = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
